<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>한국의집 출퇴근</title>
  <link rel="icon"
      href="./images/attendance-icon-512.png">

<link rel="apple-touch-icon"
      href="./images/attendance-icon-512.png">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 100%;
      background: #fff;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      color: #5b2c16;
      margin-bottom: 8px;
    }

    .store {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #777;
      margin-bottom: 26px;
    }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 24px;
    }

    .desc {
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 68px;
      border: 1px solid #ddd;
      border-radius: 18px;
      padding: 0 18px;
      font-size: 24px;
      margin-bottom: 22px;
      outline: none;
    }

    button {
      width: 100%;
      height: 74px;
      border: none;
      border-radius: 20px;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 16px;
      transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.08s ease;
      box-shadow: 0 8px 0 rgba(0,0,0,0.22);
    }

    button:active {
      transform: translateY(6px) scale(0.98);
      box-shadow: 0 2px 0 rgba(0,0,0,0.22);
      opacity: 0.88;
    }

    button:disabled {
      transform: none !important;
      box-shadow: none !important;
      opacity: 0.65;
    }

    .btn-register { background: #6b3519; color: #fff; }
    .btn-in { background: #0f8a4b; color: #fff; }
    .btn-out { background: #b3261e; color: #fff; }
    .btn-reset { background: #eee; color: #333; font-size: 18px; height: 56px; }

    .btn-disabled {
      background: #ccc !important;
      color: #777 !important;
      cursor: not-allowed;
    }

    .employee-box {
      background: #f8f4ed;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 22px;
      text-align: center;
      border: 1px solid #eadfce;
    }

    .employee-name {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .employee-phone {
      font-size: 24px;
      font-weight: 900;
      color: #333;
    }

    .status {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: #f3f3f3;
      color: #333;
      font-size: 19px;
      line-height: 1.5;
      text-align: center;
      min-height: 60px;
    }

    .hidden { display: none !important; }

    .loading-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #5b2c16;
      margin: 0 auto 18px;
      animation: pulse 1s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0.3; transform: scale(0.9); }
    }

    .attendance-greeting{text-align:center;margin:-10px 0 18px;}
    .attendance-greeting strong{display:block;font-size:16px;color:#42554d;margin-bottom:5px;}
    .attendance-greeting span{font-size:13px;color:#8a9891;}
    .daily-quote{
      margin:0 0 18px;padding:15px 16px;border-radius:18px;
      background:linear-gradient(135deg,#fffaf0,#f5f8f4);
      border:1px solid #e8e1d3;text-align:center;
    }
    .daily-quote-label{
      display:inline-block;margin-bottom:6px;font-size:11px;font-weight:900;
      letter-spacing:.04em;color:#8b6b42;
    }
    .daily-quote-text{
      font-size:14px;line-height:1.55;font-weight:800;color:#44534c;word-break:keep-all;
    }


    /* ===== 더큰코리아 출퇴근 앱 스타일로 정리 ===== */
    .wrap{
      max-width:430px;
      padding:20px 16px;
    }
    .card{
      border-radius:26px;
      padding:30px 24px 24px;
      box-shadow:0 12px 35px rgba(63,48,35,.10);
    }
    .logo{
      font-size:30px;
      margin-bottom:5px;
    }
    .store{
      font-size:15px;
      margin-bottom:24px;
    }
    .title{
      font-size:28px;
      margin-bottom:16px;
    }
    .desc{
      font-size:15px;
      line-height:1.55;
      margin-bottom:22px;
    }
    label{
      font-size:15px;
      margin-bottom:7px;
    }
    input{
      height:58px;
      border-radius:15px;
      padding:0 16px;
      font-size:19px;
      font-weight:700;
      letter-spacing:0 !important;
      margin-bottom:16px;
      background:#fff;
    }
    #phoneInput{
      letter-spacing:0 !important;
      font-variant-numeric:tabular-nums;
    }
    button{
      height:62px;
      border-radius:17px;
      font-size:22px;
      margin-top:12px;
      box-shadow:0 6px 0 rgba(0,0,0,.18);
    }
    .btn-reset{
      height:50px;
      font-size:15px;
      margin-top:12px;
    }
    .employee-box{
      padding:18px;
      border-radius:17px;
      margin-bottom:16px;
    }
    .employee-name{
      font-size:25px;
      margin-bottom:4px;
    }
    .employee-phone{
      font-size:18px;
    }
    .status{
      margin-top:16px;
      padding:14px;
      border-radius:15px;
      font-size:15px;
      min-height:50px;
    }
    .attendance-greeting{
      margin:-4px 0 14px;
    }
    .attendance-greeting strong{
      font-size:15px;
    }
    .attendance-greeting span{
      font-size:12px;
    }
    .daily-quote{
      margin:0 0 16px;
      padding:13px 14px;
      border-radius:16px;
    }
    .daily-quote-text{
      font-size:13px;
    }
    @media(max-width:480px){
      .wrap{padding:14px 12px;align-items:flex-start;}
      .card{margin-top:10px;padding:24px 18px 20px;}
      .logo{font-size:28px;}
      .title{font-size:26px;}
      input{height:56px;font-size:18px;}
      button{height:60px;font-size:21px;}
    }

  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">

      <div class="logo">한국의집</div>
      <div class="store">롯데월드몰 출퇴근 관리</div>

      <div id="loadingScreen">
        <div class="loading-dot"></div>
        <div class="title">출퇴근 앱 실행 중...</div>
        <div class="desc">직원 정보를 확인하고 있습니다.</div>
      </div>

      <div id="registerScreen" class="hidden">
        <div class="title">직원 등록</div>
        <div class="desc">
          최초 1회만 등록하면 됩니다.<br>
          이후에는 자동으로 출퇴근 화면이 열립니다.
        </div>

        <label>직원명</label>
        <input id="nameInput" type="text" placeholder="예: 홍길동">

        <label>전화번호</label>
        <input id="phoneInput" type="tel" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="010-1234-5678">

        <button class="btn-register" onclick="registerEmployee()">직원 등록</button>

        <div id="registerStatus" class="status hidden"></div>
      </div>

      <div id="attendanceScreen" class="hidden">
        <div class="title">출퇴근 체크</div>

        <div class="attendance-greeting">
          <strong>오늘도 좋은 하루 되세요.</strong>
          <span id="attendanceClock"></span>
        </div>

        <div class="daily-quote">
          <div class="daily-quote-label">오늘의 한마디</div>
          <div id="dailyQuoteText" class="daily-quote-text"></div>
        </div>

        <div class="employee-box">
          <div id="employeeName" class="employee-name"></div>
          <div id="employeePhone" class="employee-phone"></div>
        </div>

        <button id="checkInBtn" class="btn-in" onclick="submitAttendance('출근')">출근</button>
        <button id="checkOutBtn" class="btn-out" onclick="submitAttendance('퇴근')">퇴근</button>

        <button class="btn-reset" onclick="resetEmployee()">직원 정보 다시 등록</button>

        <div id="attendanceStatus" class="status">
          위치 권한을 허용해야 출퇴근이 가능합니다.
        </div>
      </div>

    </div>
  </div>

    function showDailyQuote() {
      const el = document.getElementById("dailyQuoteText");
      if (!el) return;
      const now = new Date();
      const start = new Date(now.getFullYear(), 0, 0);
      const day = Math.floor((now - start) / 86400000);
      el.textContent = DAILY_QUOTES[(day - 1) % DAILY_QUOTES.length];
    }

    function startClock() {
      function draw() {
        const el = document.getElementById("attendanceClock");
        if (!el) return;
        const d = new Date();
        el.textContent =
          d.toLocaleDateString("ko-KR", {month:"long", day:"numeric", weekday:"short"}) +
          " · " +
          d.toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"});
      }
      draw();
      setInterval(draw, 30000);
    }


    function formatPhoneInputValue(value) {
      const digits = String(value || "").replace(/\D/g, "").slice(0, 11);
      if (digits.length <= 3) return digits;
      if (digits.length <= 7) return digits.replace(/(\d{3})(\d+)/, "$1-$2");
      return digits.replace(/(\d{3})(\d{4})(\d+)/, "$1-$2-$3");
    }

    function bindPhoneInput() {
      const input = document.getElementById("phoneInput");
      if (!input) return;
      input.addEventListener("input", function () {
        this.value = formatPhoneInputValue(this.value);
      });
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbz6rYVTUixqPOhHhethQcRI4ziwNukl8EcZx9nVvFLw0rV5o4kLD_BExlONS7WPGE54sQ/exec";

    let currentEmployee = {
      name: "",
      phone: "",
      token: ""
    };

    window.onload = function () {
      bindPhoneInput();
      startClock();
      showDailyQuote();
      showLoadingScreen();

      setTimeout(function () {
        const savedToken = localStorage.getItem("hk_token");

        if (savedToken) {
          apiRequest({
            action: "getEmployeeByToken",
            token: savedToken
          }).then(function(result) {
            if (result.exists) {
              currentEmployee = {
                name: result.name,
                phone: result.phone,
                token: result.token
              };

              saveEmployee(currentEmployee);
              showAttendanceScreen();
              loadTodayStatus();
            } else {
              clearEmployee();
              showRegisterScreen();
            }
          }).catch(function() {
            showRegisterScreen();
          });
        } else {
          showRegisterScreen();
        }
      }, 800);
    };

    function registerEmployee() {
      const name = document.getElementById("nameInput").value.trim();
      const phone = normalizePhone(document.getElementById("phoneInput").value);

      if (!name) {
        showRegisterStatus("직원명을 입력해주세요.");
        return;
      }

      if (!phone) {
        showRegisterStatus("전화번호를 입력해주세요.");
        return;
      }

      showRegisterStatus("등록 중입니다...");

      apiRequest({
        action: "registerEmployee",
        name: name,
        phone: phone
      }).then(function(result) {
        if (result.success) {
          currentEmployee = {
            name: result.name,
            phone: result.phone,
            token: result.token
          };

          saveEmployee(currentEmployee);
          showAttendanceScreen();
          updateButtons(false, false);
          showAttendanceStatus("등록 완료되었습니다. 출근 버튼을 눌러주세요.");
        } else {
          showRegisterStatus(result.message || "등록에 실패했습니다.");
        }
      }).catch(function() {
        showRegisterStatus("오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
      });
    }

    function submitAttendance(type) {
      if (!currentEmployee.name || !currentEmployee.phone || !currentEmployee.token) {
        showAttendanceStatus("직원 정보가 없습니다. 다시 등록해주세요.");
        return;
      }

      const checkInBtn = document.getElementById("checkInBtn");
      const checkOutBtn = document.getElementById("checkOutBtn");

      if (type === "출근") {
        checkInBtn.innerText = "출근 처리중...";
        checkInBtn.disabled = true;
      }

      if (type === "퇴근") {
        checkOutBtn.innerText = "퇴근 처리중...";
        checkOutBtn.disabled = true;
      }

      showAttendanceStatus("위치 확인중...");

      if (!navigator.geolocation) {
        resetButtonText();
        showAttendanceStatus("이 기기에서는 위치 기능을 사용할 수 없습니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          apiRequest({
            action: "submitAttendance",
            token: currentEmployee.token,
            name: currentEmployee.name,
            phone: currentEmployee.phone,
            type: type,
            lat: position.coords.latitude,
            lng: position.coords.longitude
          }).then(function(result) {
            resetButtonText();
            showAttendanceStatus(result.message);

            if (result.success) {
              if (type === "출근") {
                updateButtons(true, false);
              } else {
                updateButtons(true, true);
              }
            } else {
              loadTodayStatus();
            }
          }).catch(function() {
            resetButtonText();
            showAttendanceStatus("오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
            loadTodayStatus();
          });
        },
        function() {
          resetButtonText();
          showAttendanceStatus("위치 권한을 허용해야 출퇴근이 가능합니다.");
          loadTodayStatus();
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function resetButtonText() {
      document.getElementById("checkInBtn").innerText = "출근";
      document.getElementById("checkOutBtn").innerText = "퇴근";
    }

    function loadTodayStatus() {
      apiRequest({
        action: "getTodayAttendanceStatus",
        phone: currentEmployee.phone
      }).then(function(result) {
        updateButtons(result.hasCheckIn, result.hasCheckOut);
      }).catch(function() {
        showAttendanceStatus("출퇴근 상태 확인 중 오류가 발생했습니다.");
      });
    }

    function apiRequest(data) {
      return fetch(API_URL, {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      }).then(function(response) {
        return response.json();
      });
    }

    function updateButtons(hasCheckIn, hasCheckOut) {
      const checkInBtn = document.getElementById("checkInBtn");
      const checkOutBtn = document.getElementById("checkOutBtn");

      resetButtonText();

      checkInBtn.disabled = false;
      checkOutBtn.disabled = false;

      checkInBtn.classList.remove("btn-disabled");
      checkOutBtn.classList.remove("btn-disabled");

      if (hasCheckIn) {
        checkInBtn.disabled = true;
        checkInBtn.classList.add("btn-disabled");
      }

      if (!hasCheckIn || hasCheckOut) {
        checkOutBtn.disabled = true;
        checkOutBtn.classList.add("btn-disabled");
      }

      if (!hasCheckIn) {
        showAttendanceStatus("아직 출근 전입니다.");
      } else if (hasCheckIn && !hasCheckOut) {
        showAttendanceStatus("출근 처리되었습니다. 퇴근 버튼을 사용할 수 있습니다.");
      } else {
        showAttendanceStatus("오늘 출근과 퇴근이 모두 처리되었습니다.");
      }
    }

    function saveEmployee(emp) {
      localStorage.setItem("hk_name", emp.name);
      localStorage.setItem("hk_phone", emp.phone);
      localStorage.setItem("hk_token", emp.token);
    }

    function clearEmployee() {
      localStorage.removeItem("hk_name");
      localStorage.removeItem("hk_phone");
      localStorage.removeItem("hk_token");
    }

    function resetEmployee() {
      clearEmployee();

      currentEmployee = {
        name: "",
        phone: "",
        token: ""
      };

      document.getElementById("nameInput").value = "";
      document.getElementById("phoneInput").value = "";

      showRegisterScreen();
    }

    function showLoadingScreen() {
      document.getElementById("loadingScreen").classList.remove("hidden");
      document.getElementById("registerScreen").classList.add("hidden");
      document.getElementById("attendanceScreen").classList.add("hidden");
    }

    function showRegisterScreen() {
      document.getElementById("loadingScreen").classList.add("hidden");
      document.getElementById("registerScreen").classList.remove("hidden");
      document.getElementById("attendanceScreen").classList.add("hidden");
    }

    function showAttendanceScreen() {
      document.getElementById("loadingScreen").classList.add("hidden");
      document.getElementById("registerScreen").classList.add("hidden");
      document.getElementById("attendanceScreen").classList.remove("hidden");

      document.getElementById("employeeName").innerText = currentEmployee.name;
      document.getElementById("employeePhone").innerText = formatPhone(currentEmployee.phone);
    }

    function showRegisterStatus(message) {
      const box = document.getElementById("registerStatus");
      box.classList.remove("hidden");
      box.innerText = message;
    }

    function showAttendanceStatus(message) {
      document.getElementById("attendanceStatus").innerText = message;
    }

    function normalizePhone(phone) {
      return String(phone || "").replace(/[^0-9]/g, "");
    }

    function formatPhone(phone) {
      phone = normalizePhone(phone);

      if (phone.length === 11) {
        return phone.replace(/(\d{3})(\d{4})(\d{4})/, "$1-$2-$3");
      }

      return phone;
    }
  </script>
